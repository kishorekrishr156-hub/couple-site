<!DOCTYPE html>
<html>
<head>
  <title>My ❤️</title>

  <style>
    body {
      margin: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      color: #7a1f2b;
      background: linear-gradient(135deg, #ffd6b0, #fcb69f, #d4af37);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('she.png') repeat;
      opacity: 1;
      pointer-events: none;
    }

    .heart {
      position: fixed;
      bottom: -10px;
      color: #ffffffaa;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }

    .sparkle {
      position: fixed;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: sparkle 3s linear infinite;
    }

    @keyframes sparkle {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      margin: 40px;
      padding: 30px;
      border-radius: 25px;
      backdrop-filter: blur(40px);
      border: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: white;
      color: #d4af37;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    #message, #future {
      margin-top: 25px;
      font-size: 22px;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Music (click to play) -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating hearts -->
  <script>
    for (let i = 0; i < 20; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
    }

    for (let i = 0; i < 30; i++) {
      let sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.style.left = Math.random() * 100 + "vw";
      sparkle.style.animationDuration = (2 + Math.random() * 3) + "s";
      document.body.appendChild(sparkle);
    }
  </script>

  <div class="card">

    <h2>Happy Valentine’s Day ❤️</h2>    
    <h1>My Dearest Priya ❤️</h1>
    <p>Kutty Ponnu 😍</p>
    <p>You are my today, tomorrow and forever 💖</p>

    <p>Together forever, no countdown needed ❤️</p>

    <button onclick="startMusic(); showLove();">
      Tap to see my heart ❤️
    </button>

    <div id="message">
      <p>Veeralakshmi, every day seeing you is a blessing 💖</p>
      <p>I am lucky to have you in my life ❤️</p>
      <p>Waiting for our 💍</p>
    </div>

    <button onclick="showFuture()">Our future together 💕</button>

    <div id="future">
      ❤️ Counting days for our special day ❤️
    </div>

  </div>

  <script>
    function startMusic() {
      const music = document.getElementById("bgMusic");
      music.play();
    }

    function showLove() {
      document.getElementById("message").style.display = "block";
    }

    function showFuture() {
      document.getElementById("future").style.display = "block";
    }
  </script>

</body>
</html>
